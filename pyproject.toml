[project]
name = "esn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BLASCOJ24", email = "j.blasco69@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly[express]>=7.0.0",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "xgboost>=3.4.1",
]

[project.scripts]
esn = "esn:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
